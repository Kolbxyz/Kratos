name: Vérification des sources

# Opens every cited source and compares quotations and figures (network access, so not part of the deploy gate).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install pypdf
      - run: npm ci
      - run: npm run check-links
      - run: npm run verify-sources -- --strict
