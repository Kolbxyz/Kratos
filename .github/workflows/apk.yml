name: APK Android

on:
  push:
    branches: [main]
    paths: ["src/**", "public/app/**", "mobile/**", "astro.config.mjs", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Optional: base64 of a keystore reused for every build, so a new APK installs over the old one.
      KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check-content
      # Only dist/app is needed: the app and the content generated from the lessons, plus the
      # library's book covers so they show offline (js/ecrans/bibliotheque.js looks there first).
      - run: |
          npx astro build
          cp -r dist/couvertures dist/app/couvertures
      - working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - working-directory: mobile/android
        run: ./gradlew assembleDebug
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk kratos.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kratos-apk
          path: kratos.apk
      # A fixed release holds the latest APK, so the phone download link never changes.
      - run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Kratos Android" --notes "Dernier APK, reconstruit à chaque modification des leçons." --prerelease
          gh release upload apk kratos.apk --clobber
