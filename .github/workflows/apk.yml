name: APK Android

on:
  push:
    branches: [main]
    paths: ["src/**", "public/app/**", "mobile/**", "astro.config.mjs", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Optional: base64 of a keystore reused for every build, so a new APK installs over the old one.
      KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check-content
      # Only dist/app is needed: the app and the content generated from the lessons, plus the
      # library's book covers so they show offline (js/ecrans/bibliotheque.js looks there first).
      - run: |
          npx astro build
          cp -r dist/couvertures dist/app/couvertures
      - working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - working-directory: mobile/android
        run: ./gradlew assembleDebug
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk kratos.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kratos-apk
          path: kratos.apk
      # A fixed release holds the latest APK, so the phone download link never changes.
      - run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Kratos Android" --notes "Dernier APK, reconstruit à chaque modification des leçons." --prerelease
          gh release upload apk kratos.apk --clobber
