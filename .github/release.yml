changelog:
  exclude:
    labels: [ignore, internal]
    authors: [dependabot, "dependabot[bot]"]
  categories:
    - title: "Features"
      labels: [feature, enhancement]
    - title: "Bug fixes"
      labels: [fix, bug]
    - title: "Security and privacy"
      labels: [security, privacy]
    - title: "Documentation"
      labels: [documentation, docs]
    - title: "Maintenance"
      labels: [maintenance, chore, dependencies, ci]
    - title: "Other changes"
      labels: ["*"]
